name: Update all-deliverables portal

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST（24時間ごとの定期巡回）
  workflow_dispatch:       # 手動実行ボタン用
    inputs:
      culture_force_update:
        description: "カルチャーの件数・無料の急減ガードを、担当者が確認したうえで一度だけ無効化する（下限50%ガードは有効のまま）"
        type: boolean
        default: false
      culture_force_reason:
        description: "強制実行の理由（確認者・根拠）。空欄の場合は強制を適用しない"
        type: string
        default: ""

permissions:
  contents: write

# 前回の実行が長引いても次のcronと重ならないようにする（2026-09-09 監査で追加）
concurrency:
  group: auto-update-portal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # スクレイパー8本の合計。ハングによる無制限実行を防ぐ（2026-09-09 監査で追加）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 近隣3市地域ポータル（badminton/official-primaryが関数を再利用するため最初に実行）
      - name: "Fetch: 近隣3市 地域ポータル"
        run: python local_portal_fetch.py

      - name: "Fetch: バドミントン代表・動向インテリジェンス"
        run: python badminton_intelligence.py

      # カルチャーは失敗しても他ページのコミットを止めない。失敗時は公開ページをHEADへ戻し、最後のゲートでジョブを失敗させる
      - name: "Fetch: 都内 美術館・写真展データベース"
        id: culture
        shell: bash
        # 強制は workflow_dispatch で「強制」にチェックし、理由を入力した場合だけ有効（定期実行は常に通常ガード）
        env:
          CULTURE_FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.culture_force_update && inputs.culture_force_reason != '' && '1' || '0' }}
          CULTURE_FORCE_REASON: ${{ inputs.culture_force_reason }}
        run: |
          set +e
          if [ "$CULTURE_FORCE_UPDATE" = "1" ]; then
            echo "::warning::カルチャーの強制実行（理由: $CULTURE_FORCE_REASON）。件数・無料の急減ガードを無効化（下限50%は有効）"
          fi
          timeout 900 python culture_exhibition_dashboard.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "culture_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::カルチャー生成が失敗（rc=$rc）。公開ページは前回版を維持し、他ページは続行"
            # カルチャーのフォルダだけを HEAD に戻し、未追跡の残骸（.tmp・途中出力）も除去する。他のフォルダには触れない
            git checkout HEAD -- docs/culture-exhibition/ || { echo "::error::カルチャーの公開ページの復元に失敗"; exit 1; }
            git clean -fdq -- docs/culture-exhibition/ || { echo "::error::カルチャーの残骸の除去に失敗"; exit 1; }
          fi

      - name: "Fetch: 経済ポータルダッシュボード"
        run: python economic_portal_dashboard.py

      - name: "Fetch: 4紙見出し比較ポータル"
        run: python newspaper_portal.py

      - name: "Fetch: 撮影スポット＆気象条件ダッシュボード"
        run: python photo_spot_dashboard.py

      - name: "Fetch: 公式一次情報収集・分析ダッシュボード"
        run: python official_primary_fetch.py

      # 朝刊は他ページの生成結果を読むため最後から2番目に実行
      - name: "Build: AI部長 朝刊（他ページ見出しダイジェスト）"
        run: python morning_news_fetch.py

      # ルートポータル（各ページの存在確認＋トップindex.html再生成）を最後に実行
      - name: "Build: 全成果物ポータル（トップページ）"
        run: python auto_fetch_all.py

      - name: Commit and push if changed
        run: |
          git config user.name "ricky-kogyo-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes" || (git commit -m "auto: update all-deliverables portal $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)

      # 最後のゲート: カルチャーが失敗していた場合のみジョブを失敗させる（他ページのコミット後に実行）
      - name: "Gate: カルチャー生成の失敗をジョブ結果に反映"
        if: ${{ always() && steps.culture.outputs.culture_failed == 'true' }}
        shell: bash
        run: |
          echo "::error::カルチャー生成が失敗。他ページは更新済み。公開ページは前回版のまま。ガード作動なら内容確認後に『手動実行』で culture_force_update と理由を指定して再実行"
          exit 1
