name: Update all-deliverables portal

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST（24時間ごとの定期巡回）
  workflow_dispatch: {}    # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check all deliverable links and rebuild portal
        run: python auto_fetch_all.py

      - name: Commit and push if changed
        run: |
          git config user.name "ricky-kogyo-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/status_history.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "auto: update all-deliverables portal $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
